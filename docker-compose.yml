services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hassan-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=${JWT_SECRET}
      - STORAGE_PATH=/app/storage
    volumes:
      # قاعدة البيانات (SQLite)
      - app_data:/app/data
      # المستندات المرفوعة
      - app_storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  app_data:
    driver: local
  app_storage:
    driver: local
